<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project | Lea Jazbinšek</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Text&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">L<span>J</span></div>
      <button class="sesame" id="sesameBtn" aria-label="menu">
        <img src="menu.svg" alt="Menu" class="menu-icon">
      </button>
      <ul class="sidenav" id="navMenu">
        <li><a href="index.html" data-nav="home">Domov</a></li>
        <li><a href="cv.html" data-nav="cv">CV</a></li>
        <li><a href="contact.html" data-nav="contact">Kontakt</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div id="project-detail" class="container project-detail-container">
      <!-- Content injected by script -->
    </div>
  </main>

  <button id="floatingLangBtn" class="floating-lang">🇸🇮 SL</button>

  <footer>
    <p id="footerText">© 2026 Lea Jazbinšek<br>Vse pravice so pridržane</p>
  </footer>

  <script src="projects.js"></script>
  <script src="script.js"></script>

  <script>
  function renderProject() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    let project = null;
    let projectCategory = null;
    if (typeof projects !== 'undefined') {
      for (const [category, projectList] of Object.entries(projects)) {
        const found = projectList.find(p => p.slug === slug);
        if (found) {
          project = found;
          projectCategory = category;
          break;
        }
      }
    }

    const container = document.getElementById('project-detail');
    if (!project) {
      container.innerHTML = '<p class="error">Project not found.</p>';
      return;
    }

    const currentLang = localStorage.getItem('lang') || 'sl';

    // Title
    const title = project.title[currentLang];

    // Project type (supports object or string)
    let type = project.details.type;
    if (type && typeof type === 'object') type = type[currentLang];
    if (!type) type = projectCategory || 'Project';

    const images = project.details.images || [];
    const sections = project.details.sections || [];

    let html = `
      <div class="project-header">
        <h1>${title}</h1>
        <div class="project-meta">${type}</div>
      </div>
    `;

    // Gallery (if any)
    if (images.length) {
      // Custom layout for coffee project (3 images: stack first two, third on right)
      if (slug === "coffee-brand-identity" && images.length === 3) {
        html += `<div class="project-gallery coffee-gallery">`;
        html += `<div class="gallery-stack">`;
        html += `<img src="${images[0]}" alt="${title}" loading="lazy">`;
        html += `<img src="${images[1]}" alt="${title}" loading="lazy">`;
        html += `</div>`;
        html += `<div class="gallery-single">`;
        html += `<img src="${images[2]}" alt="${title}" loading="lazy">`;
        html += `</div>`;
        html += `</div>`;
      }
      // Custom layout for brochure project (first full width, then two side by side)
      else if (slug === "coffee-themed-brochure" && images.length === 3) {
        html += `<div class="project-gallery brochure-gallery">`;
        html += `<div class="gallery-full">`;
        html += `<img src="${images[0]}" alt="${title}" loading="lazy">`;
        html += `</div>`;
        html += `<div class="gallery-duo">`;
        html += `<img src="${images[1]}" alt="${title}" loading="lazy">`;
        html += `<img src="${images[2]}" alt="${title}" loading="lazy">`;
        html += `</div>`;
        html += `</div>`;
      }
      else {
        // Default gallery (responsive grid)
        html += `<div class="project-gallery">`;
        images.forEach(img => {
          html += `<img src="${img}" alt="${title}" loading="lazy">`;
        });
        html += `</div>`;
      }
    }

    // Render sections (unchanged)
    sections.forEach(section => {
      if (section.type === 'image') {
        const altText = section.alt?.[currentLang] || section.alt || 'Project image';
        html += `
          <div class="project-section-image">
            <img src="${section.src}" alt="${altText}" loading="lazy">
          </div>
        `;
        return;
      }

      let heading = section.heading;
      if (heading && typeof heading === 'object') heading = heading[currentLang];
      if (heading && typeof heading !== 'string') heading = '';

      const content = section.content;

      html += `<div class="project-section">`;
      if (heading) {
        html += `<h3 class="project-section-heading">${heading}</h3>`;
      }

      if (content.paragraphs) {
        content.paragraphs.forEach(para => {
          let text = para;
          if (para && typeof para === 'object') text = para[currentLang];
          if (text) html += `<p class="project-paragraph">${text}</p>`;
        });
      }

      if (content.list) {
        html += `<ul class="project-list">`;
        content.list.forEach(item => {
          let text = item;
          if (item && typeof item === 'object') text = item[currentLang];
          if (text) html += `<li>${text}</li>`;
        });
        html += `</ul>`;
      }

      html += `</div>`;
    });

    if (sections.length === 0 && project.details.fullDescription?.[currentLang]) {
      html += `
        <div class="project-section">
          <p class="project-paragraph">${project.details.fullDescription[currentLang]}</p>
        </div>
      `;
    }

    container.innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderProject();
    window.addEventListener('languageChanged', renderProject);
  });
</script>
</body>
</html>
